# ============================================================================
# Configuration for the BindingDB Kd benchmark builder.
# All paths are resolved relative to the directory you launch the scripts from
# (the SLURM script cd's into benchmark_builder/ first). Edit to match the HPC.
# ============================================================================

paths:
  # INPUTS (already in the Savant repo)
  input_csv:     "../../Input/input.csv"           # ID(dock_N), seq, smiles, ...  (~1.3 GB)
  training_csv:  "../combined_50k_filtered.csv"     # Job_ID, smiles, features, target

  # WORK / OUTPUT (created by the scripts)
  work_dir:      "./work"                           # intermediates (fasta, mmseqs, downloads)
  output_dir:    "./output"                         # final deliverables

  # Produced by step 01, consumed by step 03
  training_with_seq_csv: "./output/combined_50k_filtered_with_seq.csv"
  training_fasta:        "./work/training_protein_chains.fasta"

  # Produced by step 02, consumed by step 03
  bindingdb_tsv: "./work/bindingdb_kd.tsv"

download:
  # BindingDB "Kd" table, curated by Therapeutics Data Commons (TDC), Harvard Dataverse.
  # Columns: ID1(drug id), X1(SMILES), ID2(UniProt), X2(target sequence), Y(Kd in nM).
  dataverse_file_id: 4291555
  url: "https://dataverse.harvard.edu/api/access/datafile/4291555"

filters:
  # --- BindingDB Kd cleaning ---
  drop_censor_caps_nM: [10000.0, 100000.0, 1000000.0, 10000000.0]  # collapsed ">X" defaults
  min_chain_len: 20

  # --- Protein: amino-acid SEQUENCE SIMILARITY (fold filter) ---
  # A BindingDB target is "seen" (excluded) if any training chain matches it at
  # >= min_seq_id identity over >= coverage of BOTH sequences (mmseqs cov-mode 0).
  # This mirrors the project's `mmseqs easy-cluster --min-seq-id 0.3` methodology.
  protein_method: "mmseqs"     # "mmseqs" (fast, recommended) or "biopython" (portable fallback)
  min_seq_id: 0.30
  coverage: 0.80
  mmseqs_sensitivity: 7.5      # -s ; high sensitivity so no homolog is missed

  # --- Ligand: SMILES SIMILARITY ---
  # A candidate ligand is excluded if it is identical OR too similar to any training
  # ligand. Identity = exact canonical SMILES or InChIKey skeleton; similarity = ECFP4
  # (Morgan r=2, 2048-bit) Tanimoto >= max_tanimoto to any training ligand.
  morgan_radius: 2
  morgan_bits: 2048
  max_tanimoto: 0.50           # raise to ~0.7 for near-duplicates only; lower to ~0.4 to be stricter

selection:
  n_pairs: 100
  pkd_bins: [-100, 4, 5, 6, 7, 8, 9, 100]   # stratify affinity across these edges
  max_per_uniprot: 4                        # cap complexes per target for diversity
  random_seed: 42

runtime:
  threads: 8                  # match --cpus-per-task in the SLURM script
