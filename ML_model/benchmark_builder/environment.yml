name: savant-benchmark
# Conda env for building the fold-disjoint / ligand-disjoint BindingDB Kd benchmark.
# Create with:  conda env create -f environment.yml   (then: conda activate savant-benchmark)
# mmseqs2 is pulled from bioconda for the protein sequence-similarity filter.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - rdkit>=2023.09          # ligand canonicalization + ECFP4 Tanimoto
  - mmseqs2>=15.0           # protein sequence-similarity clustering / search
  - biopython>=1.81         # fallback protein aligner + selected-set identity annotation
  - pyyaml>=6.0
  - tqdm>=4.65
  - requests>=2.31          # BindingDB download (run on a login node with internet)
