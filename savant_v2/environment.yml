# Conda environment for Savant v2.
#
#   conda env create -f environment.yml
#   conda activate savant2
#
# Two things are deliberately absent compared with v1:
#
#   haddock3   dropped entirely. Its seven energy terms were measured at +0.012
#              Pearson r over a plain distance-based contact count, and it was
#              the slow step, the Linux-only dependency, and the reason a bench
#              scientist could not run Savant at all.
#   biopython  not needed. burial.py carries its own Shrake-Rupley, so the
#              geometric path is numpy + scipy + RDKit and nothing else.
#   xgboost    v1's regressor was XGBoost; v2 uses sklearn's
#              HistGradientBoosting, which measured identically on the same
#              protein-grouped split (r +0.446 vs +0.453, rmse 1.293 vs 1.290).
#              sklearn is required anyway for the classifier and the splits, and
#              training fresh also drops v1's scikit-learn~=1.6.1 pin, which
#              existed only so its pickles would unpickle safely.
#
# pytorch and transformers are only needed for the cross-attention model
# (scripts 04-05). The geometric feature path, both gradient-boosted models and
# the CLI all run without them - see environment-cpu.yml for that smaller set.
name: savant2

channels:
  - conda-forge
  - pytorch

dependencies:
  # Floor is 3.10 for the union type syntax used throughout; 3.11 or 3.12 is a
  # safer choice on a cluster than the newest release, where RDKit and PyTorch
  # wheels sometimes lag.
  - python=3.12

  # --- core: feature extraction, models, CLI -----------------------------
  - numpy>=1.24
  - scipy>=1.10          # cKDTree drives every interaction feature
  - pandas>=2.0
  - pyarrow>=14          # parquet feature shards; extraction fails without it
  - rdkit>=2023.09       # ligand typing, descriptors, ECFP4
  - scikit-learn>=1.3    # HistGradientBoosting classifier + regressor
  - joblib>=1.3          # .pkl model serialisation

  # --- cross-attention model (scripts 04-05) -----------------------------
  # CPU build by default. For a GPU node, replace `cpuonly` with the matching
  # `pytorch-cuda=<version>` for your driver - check with `nvidia-smi` and see
  # the note in the README, because a mismatch here is a silent time sink.
  - pytorch>=2.2
  - cpuonly

  - pip
  - pip:
      - transformers>=4.40   # ESM-2 protein language model
