[tool.poetry]
name = "savant"
version = "0.1.0"
description = "Score an already-docked protein-ligand complex with RDKit + HADDOCK3 and emit a single feature table."
authors = ["Sayal Guirales-Medrano"]
readme = "README.md"
packages = [{ include = "savant" }]

# Floor is 3.12 because xgboost >=3.3.0 requires Python >=3.12; ceiling is
# <3.15 because haddock3 (a hard runtime dependency) supports up to 3.14.
[tool.poetry.dependencies]
python = ">=3.12,<3.15"
click = "^8.1"
biopython = "^1.83"
pandas = "^2.0"
rdkit = ">=2023.3"
# Model inference: tender_comb (scikit-learn) + mango_sponge (xgboost),
# loaded from disk with joblib. scikit-learn is pinned to the version the
# models were pickled with (1.6.1) to avoid InconsistentVersionWarning and
# any silent drift when unpickling the RandomForest. xgboost >=3.3.0 loads and
# scores the mango_sponge model correctly (verified with 3.4.0).
scikit-learn = "~1.6.1"
xgboost = ">=3.3.0"
joblib = ">=1.3"

# HADDOCK3 is a hard dependency of Savant but is LINUX-ONLY. The platform
# marker means `poetry install` installs it on Linux (e.g. your HPC) and skips
# it on Windows/macOS dev machines, where it cannot build or run. Savant shells
# out to the `haddock3` executable it provides.
haddock3 = { version = ">=2026.3.0", markers = "sys_platform == 'linux'" }

[tool.poetry.scripts]
savant = "savant.cli:main"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
